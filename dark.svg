<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <!-- Background Noise & Gradients -->
    <filter id="dark-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>
    <filter id="card-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Accent Gradients -->
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Border Shimmer Gradient -->
    <linearGradient id="shimmer-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.03)" />
      <stop offset="50%" stop-color="rgba(34,211,238,0.7)">
        <animate attributeName="offset" values="-0.5; 1.5" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>

    <!-- Scanning Line Gradient -->
    <linearGradient id="scanline-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="rgba(34,211,238,0.22)" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <clipPath id="left-panel-clip">
      <rect x="28" y="28" width="410" height="554" rx="18" />
    </clipPath>
    <clipPath id="right-panel-clip">
      <rect x="458" y="28" width="694" height="554" rx="18" />
    </clipPath>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Segoe UI Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
      .pill { transition: transform 0.3s ease; }
      .pill:hover { transform: scale(1.08); }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1180" height="610" rx="28" fill="#030712" />

  <!-- Animated Ambient Background Glows -->
  <g filter="url(#dark-blur)" opacity="0.65">
    <circle cx="180" cy="120" r="140" fill="#7C3AED">
      <animate attributeName="cx" values="180;240;180" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="120;180;120" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="160" r="170" fill="#22D3EE" opacity="0.4">
      <animate attributeName="cx" values="950;880;950" dur="14s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="520" r="150" fill="#10B981" opacity="0.35">
      <animate attributeName="cy" values="520;460;520" dur="11s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Background Floating Particles -->
  <g fill="#22D3EE" opacity="0.45">
    <circle cx="120" cy="480" r="1.5">
      <animate attributeName="cy" values="480;80" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.7;0" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="340" cy="520" r="1">
      <animate attributeName="cy" values="520;120" dur="11s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.5;0" dur="11s" repeatCount="indefinite" />
    </circle>
    <circle cx="680" cy="560" r="1.5">
      <animate attributeName="cy" values="560;100" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="500" r="1.2">
      <animate attributeName="cy" values="500;90" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.6;0" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ==================== LEFT PANEL: ASCII Cyber Terminal ==================== -->
  <g>
    <!-- Glass Background -->
    <rect x="28" y="28" width="410" height="554" rx="18" fill="#0B132B" fill-opacity="0.65" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
    <!-- Dynamic Shimmer Stroke -->
    <rect x="28" y="28" width="410" height="554" rx="18" fill="none" stroke="url(#shimmer-border)" stroke-width="1.5" />

    <!-- Terminal Header Buttons -->
    <circle cx="56" cy="52" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="72" cy="52" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="88" cy="52" r="5" fill="#10B981" opacity="0.8" />
    <text x="233" y="56" fill="#94A3B8" font-size="11" font-weight="500" text-anchor="middle" class="mono" opacity="0.7">avatar.ascii</text>

    <!-- Floating ASCII Container -->
    <g clip-path="url(#left-panel-clip)">
      <g transform="translate(0, 0)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="6s" repeatCount="indefinite" ease="easeInOut" />

        <!-- Scanline Sweep Animation -->
        <rect x="28" y="0" width="410" height="90" fill="url(#scanline-grad)">
          <animate attributeName="y" values="30;520;30" dur="7s" repeatCount="indefinite" />
        </rect>

        <!-- ASCII Portrait (Gradient Filled) -->
        <g fill="url(#cyber-grad)" font-size="10.8" font-weight="600" class="mono" letter-spacing="1.2" filter="url(#glow-soft)">
          <!-- Sequential Typing / Line Unveils -->
          <text x="52" y="110" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.1s" fill="freeze" />  ░░▒▒▓▓████████▓▓▒▒░░  </text>
          <text x="52" y="126" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.2s" fill="freeze" /> ░▒▓████████████████▓▒░ </text>
          <text x="52" y="142" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.3s" fill="freeze" />▒▓████████████████████▓▒</text>
          <text x="52" y="158" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.4s" fill="freeze" />███████▓▒░    ░▒▓███████</text>
          <text x="52" y="174" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.5s" fill="freeze" />████▓▒            ▒▓████</text>
          <text x="52" y="190" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.6s" fill="freeze" />███▓░    ●    ●    ░▓███</text>
          <text x="52" y="206" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.7s" fill="freeze" />███▓░   ┌──┐┌──┐   ░▓███</text>
          <text x="52" y="222" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.8s" fill="freeze" />████▒   └──┘└──┘   ▒████</text>
          <text x="52" y="238" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.9s" fill="freeze" />█████▒     ▲      ▒█████</text>
          <text x="52" y="254" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.0s" fill="freeze" />██████▒  ╰───╯   ▒██████</text>
          <text x="52" y="270" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.1s" fill="freeze" />▓██████▓▒      ▒▓██████▓</text>
          <text x="52" y="286" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.2s" fill="freeze" />▒▓████████████████████▓▒</text>
          <text x="52" y="302" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.3s" fill="freeze" /> ░▒▓████████████████▓▒░ </text>
          <text x="52" y="318" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.4s" fill="freeze" />   ░▒▓████████████▓▒░   </text>
          <text x="52" y="334" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.5s" fill="freeze" />     ░▒▓████████▓▒░     </text>
          <text x="52" y="350" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.6s" fill="freeze" />  ╔════════════════════╗ </text>
          <text x="52" y="366" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.7s" fill="freeze" />  ║  STATUS: READY     ║ </text>
          <text x="52" y="382" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.8s" fill="freeze" />  ║  SYSTEM: CYBER-71  ║ </text>
          <text x="52" y="398" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.9s" fill="freeze" />  ╚════════════════════╝ </text>
        </g>

        <!-- Cyber Terminal Prompt & Blinking Cursor -->
        <g transform="translate(52, 440)">
          <text x="0" y="0" fill="#22D3EE" font-size="12" class="mono">> sys.load_identity()</text>
          <text x="0" y="22" fill="#10B981" font-size="12" class="mono">✓ 100% Neural link sync</text>
          <text x="0" y="44" fill="#94A3B8" font-size="12" class="mono">> live_status: active</text>
          <rect x="176" y="33" width="8" height="13" fill="#22D3EE">
            <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
          </rect>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: Terminal Window ==================== -->
  <g>
    <!-- Glass Background -->
    <rect x="458" y="28" width="694" height="554" rx="18" fill="#0F172A" fill-opacity="0.75" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />
    <rect x="458" y="28" width="694" height="554" rx="18" fill="none" stroke="url(#shimmer-border)" stroke-width="1.5" />

    <!-- Top Navigation Dots -->
    <circle cx="488" cy="52" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="504" cy="52" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="520" cy="52" r="5" fill="#10B981" opacity="0.8" />
    <text x="805" y="56" fill="#94A3B8" font-size="11" font-weight="500" text-anchor="middle" class="mono" opacity="0.7">developer@terminal:~ (zsh)</text>

    <!-- Content Inside Right Terminal -->
    <!-- Greeting -->
    <text x="496" y="108" fill="#94A3B8" font-size="16" font-weight="500" class="sans">Hi 👋</text>
    <text x="496" y="150" fill="#F8FAFC" font-size="34" font-weight="800" class="sans" letter-spacing="-0.5">I'm <tspan fill="url(#cyber-grad)">Yeasin Kabir</tspan></text>

    <!-- Animated Multi-Role Typing Switcher -->
    <g transform="translate(496, 185)">
      <text x="0" y="0" font-size="18" font-weight="600" class="mono" fill="#22D3EE">
        <tspan>
          <animate attributeName="display" values="inline;none;none;none;none" keyTimes="0;0.2;0.4;0.6;1" dur="12s" repeatCount="indefinite" />
          Full-Stack Web Developer
        </tspan>
        <tspan>
          <animate attributeName="display" values="none;inline;none;none;none" keyTimes="0;0.2;0.4;0.6;1" dur="12s" repeatCount="indefinite" />
          Automation Enthusiast
        </tspan>
        <tspan>
          <animate attributeName="display" values="none;none;inline;none;none" keyTimes="0;0.2;0.4;0.6;1" dur="12s" repeatCount="indefinite" />
          Linux &amp; Security Researcher
        </tspan>
        <tspan>
          <animate attributeName="display" values="none;none;none;inline;none" keyTimes="0;0.2;0.4;0.6;1" dur="12s" repeatCount="indefinite" />
          Open-Source Builder
        </tspan>
        <tspan>
          <animate attributeName="display" values="none;none;none;none;inline" keyTimes="0;0.2;0.4;0.6;1" dur="12s" repeatCount="indefinite" />
          Creative Technologist
        </tspan>
      </text>
      <!-- Typing Blinking Cursor -->
      <rect x="290" y="-14" width="2.5" height="18" fill="#10B981">
        <animate attributeName="opacity" values="1;0;1" dur="0.75s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Sequential Info Items -->
    <g class="sans" font-size="13.5" transform="translate(496, 222)">
      <!-- Item 1 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze" />
        <text x="0" y="0" fill="#64748B" font-weight="600">📍 Location:</text>
        <text x="130" y="0" fill="#F8FAFC">Bangladesh</text>
      </g>
      <!-- Item 2 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze" />
        <text x="0" y="24" fill="#64748B" font-weight="600">🎓 Focus Area:</text>
        <text x="130" y="24" fill="#F8FAFC">Humanities &amp; Cyber Systems</text>
      </g>
      <!-- Item 3 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze" />
        <text x="0" y="48" fill="#64748B" font-weight="600">⚡ Core Stack:</text>
        <text x="130" y="48" fill="#F8FAFC">Node.js, Express, Python, Tailwind</text>
      </g>
      <!-- Item 4 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.9s" fill="freeze" />
        <text x="0" y="72" fill="#64748B" font-weight="600">🌐 Portfolio:</text>
        <text x="130" y="72" fill="#22D3EE">yeasinkabir.pro.bd</text>
      </g>
    </g>

    <!-- Skills Glowing Pills -->
    <g transform="translate(496, 336)">
      <text x="0" y="0" fill="#94A3B8" font-size="12" font-weight="600" class="mono" letter-spacing="1">STACK &amp; TECHNOLOGIES</text>

      <!-- Row 1 -->
      <g transform="translate(0, 16)">
        <!-- Node.js -->
        <g class="pill" transform="translate(0,0)">
          <rect width="78" height="28" rx="14" fill="#1E293B" stroke="rgba(34,211,238,0.4)" stroke-width="1" />
          <text x="39" y="18" fill="#22D3EE" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">Node.js</text>
        </g>
        <!-- Express -->
        <g class="pill" transform="translate(86,0)">
          <rect width="84" height="28" rx="14" fill="#1E293B" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
          <text x="42" y="18" fill="#F8FAFC" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">Express</text>
        </g>
        <!-- JavaScript -->
