        </g>
        <!-- Linux -->
        <g class="pill" transform="translate(462,0)">
          <rect width="70" height="28" rx="14" fill="#1E293B" stroke="rgba(124,58,237,0.4)" stroke-width="1" />
          <text x="35" y="18" fill="#A78BFA" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">Linux</text>
        </g>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 52)">
        <!-- REST APIs -->
        <g class="pill" transform="translate(0,0)">
          <rect width="90" height="28" rx="14" fill="#1E293B" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
          <text x="45" y="18" fill="#F8FAFC" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">REST APIs</text>
        </g>
        <!-- Git -->
        <g class="pill" transform="translate(98,0)">
          <rect width="56" height="28" rx="14" fill="#1E293B" stroke="rgba(239,68,68,0.4)" stroke-width="1" />
          <text x="28" y="18" fill="#F87171" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">Git</text>
        </g>
        <!-- Bash -->
        <g class="pill" transform="translate(162,0)">
          <rect width="66" height="28" rx="14" fill="#1E293B" stroke="rgba(16,185,129,0.4)" stroke-width="1" />
          <text x="33" y="18" fill="#34D399" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">Bash</text>
        </g>
        <!-- Automation -->
        <g class="pill" transform="translate(236,0)">
          <rect width="105" height="28" rx="14" fill="#1E293B" stroke="rgba(124,58,237,0.4)" stroke-width="1" />
          <text x="52.5" y="18" fill="#C084FC" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">Automation</text>
        </g>
        <!-- PWA -->
