        <path d="M18 17h12M24 11a9 9 0 0 1 0 12" stroke="#10B981" stroke-width="1" fill="none" />
        <text x="54" y="21.5" fill="#10B981" font-size="12" font-weight="600" class="sans">Portfolio</text>
      </g>

      <!-- Instagram Button -->
      <g class="pill" transform="translate(406,0)">
        <rect width="130" height="34" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="rgba(124,58,237,0.25)" stroke-width="1" />
        <rect x="17" y="10" width="1
