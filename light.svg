<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <!-- Soft Background Blur Filters -->
    <filter id="light-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur" />
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <filter id="light-soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Accent Gradients for Light Theme -->
    <linearGradient id="light-cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#10B981;#2563EB;#06B6D4" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Border Shimmer Gradient -->
    <linearGradient id="light-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.04)" />
      <stop offset="50%" stop-color="rgba(37,99,235,0.4)">
        <animate attributeName="offset" values="-0.5; 1.5" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="rgba(15,23,42,0.04)" />
    </linearGradient>

    <!-- Scanning Line Gradient -->
    <linearGradient id="light-scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="rgba(37,99,235,0.12)" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <clipPath id="l-left-panel-clip">
      <rect x="28" y="28" width="410" height="554" rx="18" />
    </clipPath>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Segoe UI Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
      .pill { transition: transform 0.3s ease; }
      .pill:hover { transform: scale(1.08); }
    </style>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1180" height="610" rx="28" fill="#FFFFFF" />

  <!-- Soft Ambient Glows -->
  <g filter="url(#light-blur)" opacity="0.32">
    <circle cx="200" cy="140" r="160" fill="#93C5FD">
      <animate attributeName="cx" values="200;260;200" dur="12s" repeatCount="indefinite" />
    </circle>
    <circle cx="940" cy="170" r="180" fill="#A5F3FC">
      <animate attributeName="cy" values="170;220;170" dur="14s" repeatCount="indefinite" />
    </circle>
    <circle cx="620" cy="500" r="150" fill="#A7F3D0">
      <animate attributeName="cx" values="620;570;620" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Animated Subtle Floating Particles -->
  <g fill="#2563EB" opacity="0.25">
    <circle cx="130" cy="480" r="1.5">
      <animate attributeName="cy" values="480;80" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.5;0" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="520" r="1.5">
      <animate attributeName="cy" values="520;100" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.6;0" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="1000" cy="500" r="1.5">
      <animate attributeName="cy" values="500;90" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.5;0" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ==================== LEFT PANEL: ASCII Cyber Terminal ==================== -->
  <g filter="url(#card-shadow)">
    <!-- Base Panel -->
    <rect x="28" y="28" width="410" height="554" rx="18" fill="#F8FAFC" fill-opacity="0.85" stroke="rgba(15,23,42,0.08)" stroke-width="1.2" />
    <rect x="28" y="28" width="410" height="554" rx="18" fill="none" stroke="url(#light-shimmer)" stroke-width="1.5" />

    <!-- Terminal Header Buttons -->
    <circle cx="56" cy="52" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="72" cy="52" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="88" cy="52" r="5" fill="#10B981" opacity="0.8" />
    <text x="233" y="56" fill="#475569" font-size="11" font-weight="600" text-anchor="middle" class="mono" opacity="0.75">avatar.ascii</text>

    <!-- Floating ASCII Area -->
    <g clip-path="url(#l-left-panel-clip)">
      <g transform="translate(0, 0)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="6s" repeatCount="indefinite" ease="easeInOut" />

        <!-- Light Scanline Animation -->
        <rect x="28" y="0" width="410" height="90" fill="url(#light-scanline)">
          <animate attributeName="y" values="30;520;30" dur="7s" repeatCount="indefinite" />
        </rect>

        <!-- ASCII Portrait (Shift Gradient) -->
        <g fill="url(#light-cyber-grad)" font-size="10.8" font-weight="600" class="mono" letter-spacing="1.2" filter="url(#light-soft-glow)">
          <text x="52" y="110" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.1s" fill="freeze" />  ░░▒▒▓▓████████▓▓▒▒░░  </text>
          <text x="52" y="126" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.2s" fill="freeze" /> ░▒▓████████████████▓▒░ </text>
          <text x="52" y="142" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.3s" fill="freeze" />▒▓████████████████████▓▒</text>
          <text x="52" y="158" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.4s" fill="freeze" />███████▓▒░    ░▒▓███████</text>
          <text x="52" y="174" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.5s" fill="freeze" />████▓▒            ▒▓████</text>
          <text x="52" y="190" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.6s" fill="freeze" />███▓░    ●    ●    ░▓███</text>
          <text x="52" y="206" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.7s" fill="freeze" />███▓░   ┌──┐┌──┐   ░▓███</text>
          <text x="52" y="222" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.8s" fill="freeze" />████▒   └──┘└──┘   ▒████</text>
          <text x="52" y="238" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.9s" fill="freeze" />█████▒     ▲      ▒█████</text>
          <text x="52" y="254" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.0s" fill="freeze" />██████▒  ╰───╯   ▒██████</text>
          <text x="52" y="270" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.1s" fill="freeze" />▓██████▓▒      ▒▓██████▓</text>
          <text x="52" y="286" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.2s" fill="freeze" />▒▓████████████████████▓▒</text>
          <text x="52" y="302" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.3s" fill="freeze" /> ░▒▓████████████████▓▒░ </text>
          <text x="52" y="318" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.4s" fill="freeze" />   ░▒▓████████████▓▒░   </text>
          <text x="52" y="334" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.5s" fill="freeze" />     ░▒▓████████▓▒░     </text>
          <text x="52" y="350" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.6s" fill="freeze" />  ╔════════════════════╗ </text>
          <text x="52" y="366" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.7s" fill="freeze" />  ║  STATUS: READY     ║ </text>
          <text x="52" y="382" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.8s" fill="freeze" />  ║  SYSTEM: CYBER-71  ║ </text>
          <text x="52" y="398" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.9s" fill="freeze" />  ╚════════════════════╝ </text>
        </g>

        <!-- Command Prompt & Cursor -->
        <g transform="translate(52, 440)">
          <text x="0" y="0" fill="#2563EB" font-size="12" class="mono">> sys.load_identity()</text>
          <text x="0" y="22" fill="#059669" font-size="12" class="mono">✓ 100% Neural link sync</text>
          <text x="0" y="44" fill="#475569" font-size="12" class="mono">> live_status: active</text>
          <rect x="176" y="33" width="8" height="13" fill="#2563EB">
            <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
          </rect>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: Terminal Window ==================== -->
  <g filter="url(#card-shadow)">
    <!-- Base Panel -->
    <rect x="458" y="28" width="694" height="554" rx="18" fill="#F8FAFC" fill-opacity="0.9" stroke="rgba(15,23,42,0.08)" stroke-width="1.2" />
    <rect x="458" y="28" width="694" height="554" rx="18" fill="none" stroke="url(#light-shimmer)" stroke-width="1.5" />

    <!-- Terminal Window Controls -->
    <circle cx="488" cy="52" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="504" cy="52" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="520" cy="52" r="5" fill="#10B981" opacity="0.8" />
    <text x="805" y="56" fill="#475569" font-size="11" font-weight="600" text-anchor="middle" class="mono" opacity="0.75">developer@terminal:~ (zsh)</text>

    <!-- Terminal Content Area -->
    <text x="496" y="108" fill="#475569" font-size="16" font-weight="500" class="sans">Hi 👋</text>
    <text x="496" y="150" fill="#0F172A" font-size="34" font-weight="800" class="sans" letter-spacing="-0.5">I'm <tspan fill="url(#light-cyber-grad)">Yeasin Kabir</tspan></text>

    <!-- Dynamic Typing Switcher -->
    <g transform="translate(496, 185)">
      <text x="0" y="0" font-size="18" font-weight="600" class="mono" fill="#2563EB">
        <tspan>
          <animate attributeName="display" values="inline;none;none;none;none" keyTimes="0;0.2;0.4;0.6;1" dur="12s" repeatCount="indefinite" />
          Full-Stack Web Developer
        </tspan>
        <tspan>
          <animate attributeName="display" values="none;inline;none;none;none" keyTimes="0;0.2;0.4;0.6;1" dur="12s" repeatCount="indefinite" />
          Automation Enthusiast
        </tspan>
        <tspan>
          <animate attributeName="display" values="none;none;inline;none;none" keyTimes="0;0.2;0.4;0.6;1" dur="12s" repeatCount="indefinite" />
          Linux &amp; Security Researcher
        </tspan>
        <tspan>
          <animate attributeName="display" values="none;none;none;inline;none" keyTimes="0;0.2;0.4;0.6;1" dur="12s" repeatCount="indefinite" />
          Open-Source Builder
        </tspan>
        <tspan>
          <animate attributeName="display" values="none;none;none;none;inline" keyTimes="0;0.2;0.4;0.6;1" dur="12s" repeatCount="indefinite" />
          Creative Technologist
        </tspan>
      </text>
      <!-- Blinking Cursor -->
      <rect x="290" y="-14" width="2.5" height="18" fill="#059669">
        <animate attributeName="opacity" values="1;0;1" dur="0.75s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Info Items -->
    <g class="sans" font-size="13.5" transform="translate(496, 222)">
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze" />
        <text x="0" y="0" fill="#64748B" font-weight="600">📍 Location:</text>
        <text x="130" y="0" fill="#0F172A">Bangladesh</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s" fill="freeze" />
        <text x="0" y="24" fill="#64748B" font-weight="600">🎓 Focus Area:</text>
        <text x="130" y="24" fill="#0F172A">Humanities &amp; Cyber Systems</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze" />
        <text x="0" y="48" fill="#64748B" font-weight="600">⚡ Core Stack:</text>
        <text x="130" y="48" fill="#0F172A">Node.js, Express, Python, Tailwind</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.9s" fill="freeze" />
        <text x="0" y="72" fill="#64748B" font-weight="600">🌐 Portfolio:</text>
        <text x="130" y="72" fill="#2563EB">yeasinkabir.pro.bd</text>
      </g>
    </g>

    <!-- Stack Pills -->
    <g transform="translate(496, 336)">
      <text x="0" y="0" fill="#475569" font-size="12" font-weight="600" class="mono" letter-spacing="1">STACK &amp; TECHNOLOGIES</text>

      <!-- Row 1 -->
      <g transform="translate(0, 16)">
        <g class="pill" transform="translate(0,0)">
          <rect width="78" height="28" rx="14" fill="#FFFFFF" stroke="rgba(37,99,235,0.3)" stroke-width="1" />
          <text x="39" y="18" fill="#2563EB" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">Node.js</text>
        </g>
        <g class="pill" transform="translate(86,0)">
          <rect width="84" height="28" rx="14" fill="#FFFFFF" stroke="rgba(15,23,42,0.1)" stroke-width="1" />
          <text x="42" y="18" fill="#0F172A" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">Express</text>
        </g>
        <g class="pill" transform="translate(178,0)">
          <rect width="98" height="28" rx="14" fill="#FFFFFF" stroke="rgba(217,119,6,0.3)" stroke-width="1" />
          <text x="49" y="18" fill="#D97706" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">JavaScript</text>
        </g>
        <g class="pill" transform="translate(284,0)">
          <rect width="78" height="28" rx="14" fill="#FFFFFF" stroke="rgba(5,150,105,0.3)" stroke-width="1" />
          <text x="39" y="18" fill="#059669" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">Python</text>
        </g>
        <g class="pill" transform="translate(370,0)">
          <rect width="84" height="28" rx="14" fill="#FFFFFF" stroke="rgba(8,145,178,0.3)" stroke-width="1" />
          <text x="42" y="18" fill="#0891B2" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">Tailwind</text>
        </g>
        <g class="pill" transform="translate(462,0)">
          <rect width="70" height="28" rx="14" fill="#FFFFFF" stroke="rgba(124,58,237,0.3)" stroke-width="1" />
          <text x="35" y="18" fill="#7C3AED" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">Linux</text>
        </g>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 52)">
        <g class="pill" transform="translate(0,0)">
          <rect width="90" height="28" rx="14" fill="#FFFFFF" stroke="rgba(15,23,42,0.1)" stroke-width="1" />
          <text x="45" y="18" fill="#0F172A" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">REST APIs</text>
        </g>
        <g class="pill" transform="translate(98,0)">
          <rect width="56" height="28" rx="14" fill="#FFFFFF" stroke="rgba(239,68,68,0.3)" stroke-width="1" />
          <text x="28" y="18" fill="#DC2626" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">Git</text>
        </g>
        <g class="pill" transform="translate(162,0)">
          <rect width="66" height="28" rx="14" fill="#FFFFFF" stroke="rgba(5,150,105,0.3)" stroke-width="1" />
          <text x="33" y="18" fill="#059669" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">Bash</text>
        </g>
        <g class="pill" transform="translate(236,0)">
          <rect width="105" height="28" rx="14" fill="#FFFFFF" stroke="rgba(124,58,237,0.3)" stroke-width="1" />
          <text x="52.5" y="18" fill="#7C3AED" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">Automation</text>
        </g>
        <g class="pill" transform="translate(349,0)">
          <rect width="62" height="28" rx="14" fill="#FFFFFF" stroke="rgba(37,99,235,0.3)" stroke-width="1" />
          <text x="31" y="18" fill="#2563EB" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">PWA</text>
        </g>
      </g>
    </g>

    <!-- Divider -->
    <line x1="496" y1="452" x2="1100" y2="452" stroke="rgba(15,23,42,0.08)" stroke-width="1" />

    <!-- Social Connection Links -->
    <g transform="translate(496, 480)">
      <!-- GitHub -->
      <g class="pill" transform="translate(0,0)">
        <rect width="118" height="34" rx="8" fill="#FFFFFF" stroke="rgba(15,23,42,0.12)" stroke-width="1" />
        <path d="M16 17c0-3.3 2.7-6 6-6 2.7 0 4.9 1.8 5.7 4.2.3.1.4.3.4.7v2.2c0 .3-.2.6-.5.7-.1 0-.2 0-.3-.1-.3-.2-.7-.4-1.2-.4-1 0-1.8.8-1.8 1.8v1.1c0 .4-.3.7-.7.7h-1.2c-.4 0-.7-.3-.7-.7v-1.1c0-1-.8-1.8-1.8-1.8-.5 0-.9.2-1.2.4-.1.1-.2.1-.3.1-.3-.1-.5-.4-.5-.7V17.9c0-.4.1-.6.4-.7.8-2.4 3-4.2 5.7-4.2z" fill="#0F172A" transform="translate(4,-2) scale(0.75)" />
        <text x="52" y="21.5" fill="#0F172A" font-size="12" font-weight="600" class="sans">GitHub</text>
      </g>

      <!-- Telegram -->
      <g class="pill" transform="translate(130,0)">
        <rect width="126" height="34" rx="8" fill="#FFFFFF" stroke="rgba(37,99,235,0.25)" stroke-width="1" />
        <circle cx="24" cy="17" r="7" fill="none" stroke="#2563EB" stroke-width="1.2" />
        <path d="M21 17l4-2-2 5 1-2" stroke="#2563EB" stroke-width="1" fill="none" />
        <text x="56" y="21.5" fill="#2563EB" font-size="12" font-weight="600" class="sans">Telegram</text>
      </g>

      <!-- Portfolio -->
      <g class="pill" transform="translate(268,0)">
        <rect width="126" height="34" rx="8" fill="#FFFFFF" stroke="rgba(5,150,105,0.25)" stroke-width="1" />
        <circle cx="24" cy="17" r="6" fill="none" stroke="#059669" stroke-width="1.2" />
        <path d="M18 17h12M24 11a9 9 0 0 1 0 12" stroke="#059669" stroke-width="1" fill="none" />
        <text x="54" y="21.5" fill="#059669" font-size="12" font-weight="600" class="sans">Portfolio</text>
      </g>

      <!-- Instagram -->
      <g class="pill" transform="translate(406,0)">
        <rect width="130" height="34" rx="8" fill="#FFFFFF" stroke="rgba(124,58,237,0.25)" stroke-width="1" />
        <rect x="17" y="10" width="14" height="14" rx="4" fill="none" stroke="#7C3AED" stroke-width="1.2" />
        <circle cx="24" cy="17" r="3.5" fill="none" stroke="#7C3AED" stroke-width="1.2" />
        <text x="54" y="21.5" fill="#7C3AED" font-size="12" font-weight="600" class="sans">Instagram</text>
      </g>
    </g>
  </g>
</svg>
