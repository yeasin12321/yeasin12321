          <rect width="62" height="28" rx="14" fill="#1E293B" stroke="rgba(34,211,238,0.4)" stroke-width="1" />
          <text x="31" y="18" fill="#22D3EE" font-size="11.5" font-weight="600" text-anchor="middle" class="mono">PWA</text>
        </g>
      </g>
    </g>

    <!-- Divider Line -->
    <line x1="496" y1="452" x2="1100" y2="452" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Social Connections -->
    <g transform="translate(496, 480)">
      <!-- GitHub Button -->
      <g class="pill" transform="translate(0,0)">
        <rect width="118" height="34" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <path d="M16 17c0-3.3 2.7-6 6-6 2.7 0 4.9 1.8 5.7 4.2.3.1.4.3.4.7v2.2c0 .3-.2.6-.5.7-.1 0-.2 0-.3-.1-.3-.2-.7-.4-1.2-.4-1 0-1.8.8-1.8 1.8v1.1c0 .4-.3.7-.7.7h-1.2c-.4 0-.7-.3-.7-.7v-1.1c0-1-.8-1.8-1.8-1.8-.5 0-.9.2-1.2.4-.1.1-.2.1-.3.1-.3-.1-.5-.4-.5-.7V17.9c0-.4.1-.6.4-.7.8-2.4 3-4.2 5.7-4.2z" fill="#F8FAFC" transform="translate(4,-2) scale(0.75)" />
        <text x="52" y="21.5" fill="#F8FAFC" font-size="12" font-weight="600" class="sans">GitHub</text>
      </g>

      <!-- Telegram Button -->
      <g class="pill" transform="translate(130,0)">
        <rect width="126" height="34" rx="8" fill="#1E293B" fill-opacity="0.8" stroke="rgba(34,211,238,0.25)" stroke-width="1" />
        <circle cx="24" cy="17" r="7" fill="none" stroke="#22D3EE" stroke-width="1.2" />
        <path d="M21 17l4-2-2 5 1-2" stroke="#22D3EE" stroke-width="1" fill="none" />
        <text x="56" y="21.5" fill="#22D3EE" font-size="12" font-weight="600" class="sans">Telegram</text>
